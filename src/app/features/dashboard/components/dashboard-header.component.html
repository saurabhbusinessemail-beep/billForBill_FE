<header class="dashboard-header">
  <button class="dashboard-header__menu-toggle" type="button" (click)="menuToggle.emit()" [attr.aria-label]="'workspace.openMenu' | translate" aria-controls="workspace-menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
  </button>
  <div class="dashboard-header__workspace">
    <span class="dashboard-header__workspace-icon" aria-hidden="true">
      <img *ngIf="businessLogo && !workspace?.workingAt" [src]="businessLogo | async" alt="" />
      <svg *ngIf="!businessLogo && workspace?.kind === 'personal'" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.1"></circle><path d="M5.7 20c.4-3.3 2.9-5.4 6.3-5.4s5.9 2.1 6.3 5.4"></path></svg>
      <svg *ngIf="!businessLogo && workspace?.kind === 'business'" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 7h2v2H9zm4 0h2v2h-2zM9 12h2v2H9zm4 0h2v2h-2z"></path></svg>
    </span>
    <strong>{{ workspace?.kind === 'personal' ? ('workspace.personal' | translate) : workspace?.legalName }}</strong>
  </div>
  <div class="dashboard-header__actions">
    <button class="dashboard-icon-button" type="button" (click)="toggleTheme()" [attr.aria-label]="(themeService.currentTheme() === 'dark' ? 'header.light' : 'header.dark') | translate" [title]="'header.theme' | translate">
      <svg *ngIf="themeService.currentTheme() === 'dark'" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
      <svg *ngIf="themeService.currentTheme() === 'light'" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 14A8.6 8.6 0 0 1 10 3.2 8.8 8.8 0 1 0 20.8 14Z"></path></svg>
    </button>
    <div class="dashboard-header__profile">
      <button class="dashboard-icon-button" type="button" (click)="toggleProfileMenu()" [attr.aria-label]="'header.userMenu' | translate" [attr.aria-expanded]="profileMenuOpen" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"></circle><path d="M5.5 20c.3-3.5 2.8-5.6 6.5-5.6s6.2 2.1 6.5 5.6"></path></svg>
      </button>
      <div class="dashboard-profile-menu" *ngIf="profileMenuOpen" role="menu">
        <span class="dashboard-profile-menu__label">{{ 'header.account' | translate }}</span>
        <div class="dashboard-profile-menu__identity"><strong>{{ authService.currentUser()?.name }}</strong><small>{{ authService.currentUser()?.phoneE164 }}</small></div>
        <a routerLink="/dashboard/profile" role="menuitem" (click)="profileMenuOpen = false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"></circle><path d="M5.5 20c.3-3.5 2.8-5.6 6.5-5.6s6.2 2.1 6.5 5.6"></path></svg>
          {{ 'profile.title' | translate }}
        </a>
        <button type="button" role="menuitem" (click)="signOutNow()" [disabled]="isSigningOut">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3m9-9h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"></path></svg>
          {{ (isSigningOut ? 'header.signingOut' : 'header.signOut') | translate }}
        </button>
      </div>
    </div>
  </div>
</header>
<p class="dashboard-header__error" role="alert" *ngIf="errorKey">{{ errorKey | translate }}</p>
