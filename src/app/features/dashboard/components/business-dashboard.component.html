<section class="f007-denied" *ngIf="permissionDenied" role="alert">{{ 'f007.permissionDenied' | translate }}</section>
<ng-container *ngIf="!permissionDenied">
<app-business-details-card *ngIf="!business.workingAt" [business]="business" (edit)="editBusiness.emit()"></app-business-details-card>
<section class="f006-summary" *ngIf="counts as c" aria-label="{{ 'f006.summary' | translate }}">
  <button type="button" (click)="open('people')"><span class="summary-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m7-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm9 2a4 4 0 0 1 3 4v2m-3-18a4 4 0 0 1 0 8" /></svg></span><span class="summary-arrow" aria-hidden="true">→</span><strong>{{ c.people }}</strong><span class="summary-label">{{ 'f006.people' | translate }}</span><small>{{ 'f006.summaryPeopleHint' | translate }}</small></button>
  <button type="button" (click)="open('teams')"><span class="summary-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V5h10v16m0-11h4v11M8 8h4m-4 4h4m-4 4h4m8-2h-1m1 4h-1" /></svg></span><span class="summary-arrow" aria-hidden="true">→</span><strong>{{ c.teams }}</strong><span class="summary-label">{{ 'f006.teams' | translate }}</span><small>{{ 'f006.summaryTeamsHint' | translate }}</small></button>
  <button type="button" (click)="open('teams')"><span class="summary-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-3Zm-3 9 2 2 4-4" /></svg></span><span class="summary-arrow" aria-hidden="true">→</span><strong>{{ c.permissions }}</strong><span class="summary-label">{{ 'f006.teamPermissions' | translate }}</span><small>{{ 'f006.summaryPermissionsHint' | translate }}</small></button>
  <button *ngIf="permissionKeys.has('business.orders.view')" type="button" (click)="open('orders')"><span class="summary-icon" aria-hidden="true">▤</span><span class="summary-arrow" aria-hidden="true">→</span><strong>{{ c.billCount || 0 }} / {{ c.orderCount || 0 }}</strong><span class="summary-label">{{ 'f015.ordersSummary' | translate }}</span><small>{{ 'f015.billOrderCounts' | translate }}</small></button>
  <button *ngIf="permissionKeys.has('business.leads.view')" type="button" (click)="open('leads')"><span class="summary-icon" aria-hidden="true">↗</span><span class="summary-arrow" aria-hidden="true">→</span><strong>{{ c.orderCount || 0 }} / {{ c.leadCount || 0 }}</strong><span class="summary-label">{{ 'f015.leadsSummary' | translate }}</span><small>{{ 'f015.orderLeadCounts' | translate }}</small></button>
  <button *ngIf="permissionKeys.has('business.bills.view')" type="button" (click)="open('bills')"><span class="summary-icon" aria-hidden="true">▤</span><span class="summary-arrow" aria-hidden="true">→</span><strong>{{ c.billCount || 0 }}</strong><span class="summary-label">{{ 'f017.bills' | translate }}</span><small>{{ 'f017.receivable' | translate }} {{ c.receivable || '0.00' }} · {{ 'f017.payable' | translate }} {{ c.payable || '0.00' }}</small></button>
  <button *ngIf="permissionKeys.has('business.payments.view')" type="button" (click)="open('payments')"><span class="summary-icon" aria-hidden="true">¤</span><span class="summary-arrow" aria-hidden="true">→</span><strong>{{ c.paymentsCount || 0 }}</strong><span class="summary-label">{{ 'f017.payments' | translate }}</span><small>{{ 'f017.inTransitCount' | translate }} {{ c.inTransit || 0 }}</small></button>
  <ng-container *ngIf="permissionKeys.has('business.catalog.view')">
    <button type="button" (click)="open('catalog/products')"><span class="summary-icon" aria-hidden="true">▦</span><span class="summary-arrow" aria-hidden="true">→</span><strong>{{ c.products || 0 }}</strong><span class="summary-label">{{ 'f009.products' | translate }}</span></button>
    <button type="button" (click)="open('catalog/categories')"><span class="summary-icon" aria-hidden="true">▤</span><span class="summary-arrow" aria-hidden="true">→</span><strong>{{ c.categories || 0 }}</strong><span class="summary-label">{{ 'f009.categories' | translate }}</span></button>
    <button type="button" (click)="open('catalog/attributes')"><span class="summary-icon" aria-hidden="true">⌘</span><span class="summary-arrow" aria-hidden="true">→</span><strong>{{ c.attributes || 0 }}</strong><span class="summary-label">{{ 'f009.attributes' | translate }}</span></button>
    <button type="button" (click)="open('catalog/units')"><span class="summary-icon" aria-hidden="true">↔</span><span class="summary-arrow" aria-hidden="true">→</span><strong>{{ c.units || 0 }}</strong><span class="summary-label">{{ 'f009.units' | translate }}</span></button>
    <button type="button" (click)="open('catalog/taxes')"><span class="summary-icon" aria-hidden="true">%</span><span class="summary-arrow" aria-hidden="true">→</span><strong>{{ c.taxes || 0 }}</strong><span class="summary-label">{{ 'f009.taxes' | translate }}</span></button>
  </ng-container>
</section>
<app-no-data-card [workspaceName]="business.legalName ?? ''"></app-no-data-card>
</ng-container>
